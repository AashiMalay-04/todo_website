<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>My To-Do List</h1>

    <form action="{{ url_for('add_task') }}" method="post">
        <input
            type="text"
            name="task"
            placeholder="Enter a new task"
            required
        >
        <button type="submit">Add Task</button>
    </form>

    <h2>Tasks</h2>

    <ul>
        {% for task in tasks %}
            <li
                class="task-item {% if task['done'] %}is-complete{% endif %}"
                ondblclick="toggleActions(this)"
            >
                <form
                    action="{{ url_for('toggle_task', task_id=task['id']) }}"
                    method="post"
                    class="checkbox-form"
                >
                    <input
                        type="checkbox"
                        aria-label="Mark task complete"
                        onchange="this.form.submit()"
                        {% if task["done"] %}checked{% endif %}
                    >
                </form>

                <span class="task-text">{{ task["text"] }}</span>

                <div class="task-actions">
                    <a
                        class="edit-link"
                        href="{{ url_for('edit_task', task_id=task['id']) }}"
                    >
                        Edit
                    </a>

                    <form
                        action="{{ url_for('toggle_task', task_id=task['id']) }}"
                        method="post"
                    >
                        <button type="submit">
                            {% if task["done"] %}Undo{% else %}Complete{% endif %}
                        </button>
                    </form>

                    <form
                        action="{{ url_for('delete_task', task_id=task['id']) }}"
                        method="post"
                    >
                        <button type="submit" class="delete-button">Delete</button>
                    </form>
                </div>
            </li>
        {% else %}
            <li>No tasks yet.</li>
        {% endfor %}
    </ul>

    <script>
        function toggleActions(taskItem) {
            taskItem.classList.toggle("show-actions");
        }
    </script>
</body>
</html>
