<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
</head>
<body>
    <h1>My To-Do List</h1>

    <form action = "{{ url_for('add_task')}}" method = "post">
        <input 
            type="text" 
            name = "task"
            placeholder="Enter a new task"
            required
        >
        <button type="submit">Add Task</button>
    </form>

    <h2>Tasks</h2>

    <ul>
        {% for task in tasks %}
            <li>
                <form 
                    action = "{{ url_for('toggle_task', task_id = task["id"] ) }}"
                    method = "post"
                    style = "display:inline;"
                >
                <button type="submit">
                        {% if task["done"] %}Undo{% else %}Complete{% endif %}
                    </button>
                </form>

                <form
                    action = "{{ url_for('delete_task', task_id = task["id"] ) }}"
                    method = "post"
                    style = "display:inline;"
                >
                    <button type="submit">Delete</button>
                </form>

                {% if task["done"] %}
                    <s>{{ task["text"] }}</s> (completed)
                {% else %}
                    {{ task["text"] }}
                {% endif %}
                    
            </li>
        {% else %}
            <li>No tasks yet.</li>
        {% endfor %}
    </ul>
</body>
</html>
